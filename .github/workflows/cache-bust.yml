name: Cache-bust images

# Whenever a photo is added or replaced, re-stamp the image URLs in the HTML
# with a hash of the new file so visitors' browsers pick it up immediately
# instead of showing a cached copy for up to 4 hours.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-bust
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp image URLs with content hashes
        run: python3 tools/stamp-cache-bust.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "Nothing to update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh image cache-busting hashes"
          git push
